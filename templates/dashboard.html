{% extends "base.html" %}{% block head %}<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>{% endblock %}
{% block content %}
<div class="cards"><div class="card"><small>Spent this month</small><b id="cSpent">-</b></div><div class="card"><small>Monthly income</small><b id="cIncome">-</b></div>
<div class="card"><small>Predicted next month</small><b id="cPred">-</b></div><div class="card"><small>New alerts</small><b id="cAlerts">-</b></div></div>
<div class="grid2"><div class="panel"><h3>Spending by category</h3><canvas id="barChart" height="230"></canvas></div>
<div class="panel"><h3>Total spending and forecast</h3><canvas id="lineChart" height="230"></canvas><div id="fcMsg" class="muted"></div></div></div>
<div class="panel"><h3>Category budgets - <span id="monthLbl"></span></h3><table><thead><tr><th>Category</th><th>Type</th><th>Spent</th><th>Budget</th><th>Used</th><th>Status</th></tr></thead><tbody id="catRows"></tbody></table></div>
<div class="panel"><h3>Settings</h3><div class="row"><div><label>Monthly income (Rs.)</label><input id="incomeInput" type="number" min="0"><button id="saveIncome">Save income</button></div>
<div><label>Delete account (enter password)</label><input id="delPw" type="password"><button class="red" id="delAcc">Delete my account and data</button></div></div><div id="setMsg" class="msg"></div></div>
{% endblock %}
